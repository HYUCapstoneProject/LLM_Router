steps:
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    env:
      - 'MODELS=${_MODELS}'
    args:
      - '-c'
      - |
        set -e
        pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
        pip install --quiet --no-cache-dir "sentence-transformers>=5.1,<6" "transformers>=4.48" sentencepiece protobuf
        python score.py
timeout: '7200s'
options:
  machineType: 'E2_HIGHCPU_32'
substitutions:
  _MODELS: ''
