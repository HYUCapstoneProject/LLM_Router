[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router-labeling"
version = "0.1.0"
description = "RouterBench training data and RouterArena routing evaluation tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=17,<22",
]

[project.optional-dependencies]
model-evaluation = [
  "torch==2.5.1",
  "transformers==4.48.3",
]
model-training = [
  "torch==2.5.1",
  "transformers==4.48.3",
]

[project.scripts]
routerbench-labeling = "llm_router_labeling.training.routerbench_cli:main"
routerarena-preprocessing = "llm_router_labeling.evaluation.routerarena_cli:main"
routerarena-evaluate = "llm_router_labeling.evaluation.routerarena_evaluation_cli:main"
escalation-feedback-preprocessing = "llm_router_labeling.training.feedback_retraining_cli:main"
modernbert-train = "llm_router_labeling.training.modernbert_training_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
