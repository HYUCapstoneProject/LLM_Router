server:
  port: 8080

spring:
  application:
    name: llm-router
  datasource:
    url: jdbc:h2:mem:llmrouter;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true  # http://localhost:8080/h2-console 로 DB 확인 가능

llm:
  router:
    routing-threshold: 0.7
  cache:
    similarity-threshold: 0.8
